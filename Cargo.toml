[workspace]
resolver = "2"
members = ["crates/albe-core", "crates/albe-wasm", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Small WebAssembly for the web build
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
