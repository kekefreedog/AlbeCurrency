[package]
name = "albe-app"
description = "AlbeCurrency native shell: storage and commands around albe-core."
authors = ["kekefreedog <kevin.zarshenas@gmail.com>"]
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "albe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
albe-core = { path = "../crates/albe-core" }
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"
